  <style>
    :root {
      --navy: #082e5f;
      --navy-dark: #051c3b;
      --blue: #07519a;
      --blue-light: #eaf3fb;
      --red: #e3222c;
      --red-hover: #c41821;
      --muted: #58708e;
      --border: #dce8f3;
      --bg-card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--navy);
      background: #f8fafc;
      -webkit-font-smoothing: antialiased;
    }

    header {
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4%;
      border-bottom: 1px solid #e3edf7;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(8, 46, 95, 0.04);
    }
    .brand-container {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      cursor: pointer;
    }
    .brand-img {
      height: 64px;
      width: auto;
      display: block;
      object-fit: contain;
      flex-shrink: 0;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 15px;
      font-weight: 600;
    }
    nav a {
      text-decoration: none;
      color: var(--navy);
      padding: 8px 12px;
      border-radius: 8px;
      transition: all 0.2s;
      cursor: pointer;
    }
    nav a:hover { color: var(--blue); background: var(--blue-light); }
    nav a.active {
      background: var(--blue);
      color: #fff;
    }
    .spectator-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--blue-light);
      border: 1px solid #d0e3f5;
      color: var(--navy);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: default;
      transition: all 0.2s;
    }
    .spectator-badge:hover {
      border-color: var(--blue);
      background: #deedfa;
    }
    .spectator-badge strong {
      color: var(--blue);
      font-weight: 800;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .btn-wishlist {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--navy);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
    }
    .btn-wishlist:hover { border-color: var(--red); color: var(--red); }
    .btn-wishlist.active { background: var(--red); color: #fff; border-color: var(--red); }
    .badge-count {
      background: var(--red);
      color: #fff;
      border-radius: 10px;
      padding: 2px 7px;
      font-size: 11px;
    }
    .btn-wishlist.active .badge-count { background: #fff; color: var(--red); }

    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(5, 28, 59, 0.88) 0%, rgba(5, 28, 59, 0.65) 45%, rgba(5, 28, 59, 0.25) 75%, rgba(5, 28, 59, 0.05) 100%);
    }
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 760px;
    }
    .hero h1 {
      font-size: 38px;
      font-weight: 800;
      margin: 0 0 12px;
      letter-spacing: -0.5px;
      line-height: 1.15;
    }
    .hero p {
      font-size: 18px;
      margin: 0 0 24px;
      color: #e2ecf7;
      line-height: 1.45;
    }
    .search-box {
      display: flex;
      gap: 8px;
      background: #fff;
      padding: 6px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .search-box input {
      flex: 1;
      height: 48px;
      border: 0;
      padding: 0 16px;
      font-size: 16px;
      color: var(--navy);
      outline: none;
    }
    .search-box button {
      height: 48px;
      padding: 0 26px;
      border: 0;
      border-radius: 8px;
      background: var(--red);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .search-box button:hover { background: var(--red-hover); }

    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px 4% 80px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 14px;
      color: var(--navy);
    }
    .categories {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 13px;
      margin-bottom: 34px;
    }
    .cat {
      height: 104px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 12px;
      color: var(--navy);
      text-align: left;
      padding: 16px 14px;
      position: relative;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(8, 46, 95, 0.03);
    }
    .cat:hover, .cat.active {
      transform: translateY(-2px);
      border-color: var(--blue);
      box-shadow: 0 6px 16px rgba(7, 81, 154, 0.12);
    }
    .cat.active {
      background: var(--blue-light);
      border: 2px solid var(--blue);
    }
    .cat i {
      position: absolute;
      left: 14px;
      top: 24px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
    }
    .cat i svg {
      width: 36px;
      height: 36px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .cat b {
      display: block;
      margin-left: 50px;
      font-size: 15px;
      font-weight: 700;
    }
    .cat small {
      display: block;
      margin: 4px 0 0 50px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }
    .cat em {
      position: absolute;
      right: 14px;
      bottom: 10px;
      color: var(--red);
      font-size: 20px;
      font-style: normal;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 24px 0 18px;
      padding-left: 60px;
      position: relative;
    }
    .toolbar::before {
      content: "";
      position: absolute;
      left: 0;
      top: 14px;
      width: 44px;
      height: 4px;
      background: var(--red);
      border-radius: 2px;
    }
    .toolbar h2 {
      font-size: 26px;
      margin: 0;
      font-weight: 800;
    }
    .count {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--navy);
      line-height: 1.1;
    }
    .brand-title-accent {
      color: var(--red);
    }
    .brand-sub {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.2px;
    }
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 28px 0 20px;
      padding-left: 50px;
      position: relative;
      flex-wrap: wrap;
      gap: 16px;
    }
    .filter-bar::before {
      content: "";
      position: absolute;
      left: 0;
      top: 14px;
      width: 36px;
      height: 4px;
      background: var(--red);
      border-radius: 2px;
    }
    .toolbar-left h2 {
      font-size: 26px;
      margin: 0 0 4px;
      font-weight: 800;
    }
    .target-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .target-pills-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      margin-right: 4px;
    }
    .pill {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--navy);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill:hover {
      border-color: var(--blue);
      color: var(--blue);
    }
    .pill.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px 16px;
      background: #fff;
      box-shadow: 0 3px 10px rgba(8, 46, 95, 0.04);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(8, 46, 95, 0.09);
    }
    .btn-fav {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 5;
      background: rgba(255, 255, 255, 0.9);
      border: 0;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: #94a3b8;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: all 0.2s;
    }
    .btn-fav:hover, .btn-fav.active { color: var(--red); transform: scale(1.1); }
    .btn-fav.active { background: #fff; }

    .cover {
      height: 200px;
      border-radius: 8px;
      margin-bottom: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      overflow: hidden;
      background: #f1f5f9;
    }
    .cover.has-real-cover {
      background: #f1f5f9;
      padding: 6px;
      box-shadow: inset 0 0 0 1px #e2e8f0;
    }
    .cover-real-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 4px;
      display: block;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    }
    .cover-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.25);
    }
    .cover-Fachbuch { background: linear-gradient(135deg, #093f77, #041935); }
    .cover-Biografie { background: linear-gradient(135deg, #c05e10, #5c2700); }
    .cover-Kinderbuch { background: linear-gradient(135deg, #0d9468, #05412d); }
    .cover-Jugendbuch { background: linear-gradient(135deg, #1b68b3, #092f57); }
    .cover-Sachbuch { background: linear-gradient(135deg, #6b33a8, #301053); }

    .cover-icon { font-size: 32px; margin-bottom: 6px; }
    .cover b { font-size: 14px; line-height: 1.25; font-weight: 700; }
    .cover .sub { font-size: 11px; opacity: 0.9; margin-top: 4px; font-weight: 500; }
    .badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      color: #fff;
      border-radius: 5px;
      padding: 3px 7px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge-Fachbuch { background: #07519a; }
    .badge-Biografie { background: #ea580c; }
    .badge-Kinderbuch { background: #10b981; }
    .badge-Jugendbuch { background: #0284c7; }
    .badge-Sachbuch { background: #8b5cf6; }

    .card h3 {
      font-size: 16px;
      line-height: 1.3;
      margin: 0 0 4px;
      font-weight: 700;
      color: var(--navy);
    }
    .card .card-subtitle {
      font-size: 12px;
      color: var(--blue);
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.25;
    }
    .author {
      color: var(--muted);
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
    }
    .meta {
      display: flex;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .meta span {
      background: #f1f5f9;
      color: #475569;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
    }
    .price-row {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
    }
    .price {
      font-size: 17px;
      font-weight: 800;
    }
    .btn-details {
      border: 0;
      background: var(--red);
      color: #fff;
      border-radius: 7px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-details:hover { background: var(--red-hover); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 46, 95, 0.7);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal {
      background: #fff;
      width: 100%;
      max-width: 640px;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      max-height: 90vh;
      overflow-y: auto;
      padding: 26px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 26px;
      border: 0;
      background: none;
      color: var(--muted);
      cursor: pointer;
    }
    .modal h3 {
      margin: 0 0 4px;
      font-size: 22px;
