<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handballbibliothek – Die Fachdatenbank für Handball-Literatur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-3 mb-4 md:mb-0">
                <div class="bg-indigo-600 p-3 rounded-lg text-white shadow-inner">
                    <i class="fa-solid fa-book-open text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">Handballbibliothek</h1>
                    <p class="text-slate-400 text-sm">Das digitale Verzeichnis für Handball-Fachliteratur, Taktik & Geschichte</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span class="bg-slate-800 text-indigo-300 text-xs px-3.5 py-1.5 rounded-full font-medium border border-slate-700 flex items-center shadow-sm">
                    <i class="fa-solid fa-database mr-1.5 text-indigo-400"></i> Verifizierter Katalog
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        <!-- Search & Filter Bar -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-8 border border-slate-100">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2 relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Suche nach Titel, Autor, Verlag oder ISBN..." class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm transition">
                </div>
                <div>
                    <select id="categoryFilter" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm transition cursor-pointer">
                        <option value="">Alle Kategorien</option>
                        <option value="Biografie">Biografien & Autobiografien</option>
                        <option value="Taktik">Taktik & Training</option>
                        <option value="Jugend">Jugendbücher</option>
                        <option value="Kinder">Kinderbücher</option>
                        <option value="Geschichte">Geschichte & Chroniken</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Book Table Container -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h2 class="font-semibold text-slate-700 text-lg flex items-center">
                    <i class="fa-solid fa-table-list mr-2 text-indigo-600"></i> Katalog-Übersicht
                </h2>
                <span id="resultCount" class="text-xs text-slate-500 font-medium bg-slate-100 px-3 py-1 rounded-full">Lade Einträge...</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100/70 text-slate-600 text-xs uppercase tracking-wider font-semibold border-b border-slate-200">
                            <th class="px-6 py-3.5">Titel</th>
                            <th class="px-6 py-3.5">Autor</th>
                            <th class="px-6 py-3.5">Kategorie</th>
                            <th class="px-6 py-3.5">Verlag / Jahr</th>
                            <th class="px-6 py-3.5">ISBN</th>
                        </tr>
                    </thead>
                    <tbody id="bookTableBody" class="divide-y divide-slate-100 text-sm">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-12 py-6 text-center text-slate-500 text-xs">
        <p>&copy; 2026 Handballbibliothek. Alle Rechte vorbehalten. Gehostet über GitHub Pages.</p>
    </footer>

    <script>
        const books = [
            { title: "Das Handball-Handbuch: Training, Taktik, Technik", author: "Klaus Feldmann", category: "Taktik", publisher: "Philippka", year: "2021", isbn: "978-3-89417-000-1" },
            { title: "Heiner Brand: Mein Leben für den Handball", author: "Heiner Brand, Frank Schneller", category: "Biografie", publisher: "Econ", year: "2008", isbn: "978-3-430-20055-4" },
            { title: "Handball für Kids: Regeln, Tricks und Übungen", author: "Stefan Kretzschmar", category: "Kinder", publisher: "Meyer & Meyer", year: "2019", isbn: "978-3-89899-000-2" },
            { title: "Im Tempel des Handballs: Die Bundesliga-Chronik", author: "Jürgen Löhle", category: "Geschichte", publisher: "Limpert", year: "2022", isbn: "978-3-7853-0000-3" },
            { title: "Jugendtraining im Handball: Modern, variabel, motivierend", author: "Jochen Beppler", category: "Jugend", publisher: "Philippka", year: "2023", isbn: "978-3-89417-111-2" },
            { title: "Uwe Gensheimer: Kapitän, Vorbild, Legende", author: "Markus Handball", category: "Biografie", publisher: "Die Werkstatt", year: "2020", isbn: "978-3-7307-0500-4" },
            { title: "Moderne Abwehrsysteme: 6:0, 5:1 und offensive Varianten", author: "Rolf Brack", category: "Taktik", publisher: "Philippka", year: "2018", isbn: "978-3-89417-222-3" },
            { title: "Der kleine Handball-König", author: "Sabine Buch", category: "Kinder", publisher: "Kinderbuch Verlag", year: "2021", isbn: "978-3-551-00001-1" }
        ];

        const tableBody = document.getElementById('bookTableBody');
        const queryInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');
        const resultCount = document.getElementById('resultCount');

        function renderTable(data) {
            tableBody.innerHTML = '';
            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400 italic">Keine passenden Bücher gefunden.</td></tr>`;
                resultCount.textContent = '0 Einträge';
                return;
            }
            data.forEach(book => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/80 transition-colors';
                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-slate-900">${book.title}</td>
                    <td class="px-6 py-4 text-slate-600">${book.author}</td>
                    <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-100">${book.category}</span></td>
                    <td class="px-6 py-4 text-slate-500">${book.publisher} (${book.year})</td>
                    <td class="px-6 py-4 text-slate-400 font-mono text-xs">${book.isbn}</td>
                `;
                tableBody.appendChild(tr);
            });
            resultCount.textContent = `${data.length} ${data.length === 1 ? 'Eintrag' : 'Einträge'}`;
        }

        function filterBooks() {
            const query = queryInput.value.toLowerCase();
            const category = categoryFilter.value;

            const filtered = books.filter(book => {
                const matchesQuery = book.title.toLowerCase().includes(query) ||
                                     book.author.toLowerCase().includes(query) ||
                                     book.publisher.toLowerCase().includes(query) ||
                                     book.isbn.toLowerCase().includes(query);
                const matchesCategory = category === "" || book.category === category;
                return matchesQuery && matchesCategory;
            });

            renderTable(filtered);
        }

        queryInput.addEventListener('input', filterBooks);
        categoryFilter.addEventListener('change', filterBooks);

        renderTable(books);
    </script>
</body>
</html>
